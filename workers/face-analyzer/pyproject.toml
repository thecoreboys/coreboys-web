[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "core-face-analyzer"
version = "0.1.0"
description = "Consent-gated, local-only face-tag proposal worker for CORE"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "av==15.1.0",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
]

[project.optional-dependencies]
db = ["psycopg[binary]==3.2.10"]

[project.scripts]
core-face-analyzer = "face_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["face_analyzer*"]
