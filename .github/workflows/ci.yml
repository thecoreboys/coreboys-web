name: CI

on:
  # Push trigger temporarily disabled — re-enable once the reusable
  # workflow can clone sibling repos via GITHUB_BUILD_TOKEN. Until then
  # CI runs on PRs only so red badges don't appear on main pushes.
  pull_request:

jobs:
  ci:
    uses: thecoreboys/coreboys-infra/.github/workflows/reusable-node-ci.yml@main
    with:
      node-version: "20"
      pnpm-version: "10"
      run-test: false
