name: CI

on:
  # Push trigger temporarily disabled — re-enable once the reusable
  # workflow can clone sibling repos via GITHUB_BUILD_TOKEN. Until then
  # CI runs on PRs only so red badges don't appear on main pushes.
  pull_request:

jobs:
  ci:
    uses: thecoreboys/coreboys-infra/.github/workflows/reusable-node-ci.yml@main
    with:
      node-version: "20"
      pnpm-version: "10"
      run-test: true

  face-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test consent and matching policy without model downloads
        working-directory: workers/face-analyzer
        run: python -m unittest discover -s tests -v
