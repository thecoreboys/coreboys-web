name: Reconcile social events
on:
  # Keep the GitHub schedule during the Azure Jobs rollout. The provider
  # leases make overlapping calls read-only; remove this schedule only after
  # successful Azure executions have been observed in production.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: core-social-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile content and deliver notifications
        env:
          APP_URL: https://thecoreboys.com
          SECRET: ${{ secrets.METRICS_CRON_SECRET }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${SECRET:-}" ]]; then
            echo "METRICS_CRON_SECRET is not configured; refusing an unauthenticated reconciliation." >&2
            exit 1
          fi

          target="${APP_URL%/}/api/social/reconcile"
          echo "Reconciling social events at ${target}"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 240 \
            -X POST \
            -H "x-cron-secret: $SECRET" \
            -H "accept: application/json" \
            -w "\nHTTP %{http_code}\n" \
            "$target"
