name: cron-core-captions

on:
  schedule:
    - cron: "35 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-caption-acquisition
  cancel-in-progress: false

jobs:
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install yt-dlp==2026.8.19
      - run: python scripts/test-fetch-youtube-captions.py
      - name: Acquire up to two original English caption tracks for staff review
        env:
          MEDIA_INTELLIGENCE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEDIA_INTELLIGENCE_ALLOW_REMOTE_DATABASE: "true"
          CORE_CAPTION_PROCESSING_AUTHORIZED: "true"
          CORE_CAPTION_PERMISSION_REFERENCE: "Operator confirmed permission for CORE creators' video/audio on 2026-09-08. Caption-only pilot is limited to the configured official CORE YouTube channel."
        run: node --conditions=react-server --import tsx scripts/import-youtube-captions.ts --apply
