name: cron-snapshot

# Daily social and TwitchTracker snapshots. The TwitchTracker endpoint is a
# rolling 30-day summary; storing one validated sample per day gives the site
# a durable history without making third-party calls during page rendering.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/metrics/snapshot
        env:
          APP_URL: ${{ secrets.METRICS_APP_URL }}
          SECRET: ${{ secrets.METRICS_CRON_SECRET }}
        run: |
          set -e
          echo "Hitting $APP_URL/api/metrics/snapshot"
          curl -fsS -X POST \
            -H "x-cron-secret: $SECRET" \
            -w "\nHTTP %{http_code}\n" \
            "$APP_URL/api/metrics/snapshot"

      - name: POST /api/metrics/twitchtracker/snapshot
        env:
          APP_URL: ${{ secrets.METRICS_APP_URL }}
          SECRET: ${{ secrets.METRICS_CRON_SECRET }}
        run: |
          set -e
          echo "Hitting $APP_URL/api/metrics/twitchtracker/snapshot"
          curl -fsS -X POST \
            -H "x-cron-secret: $SECRET" \
            -w "\nHTTP %{http_code}\n" \
            "$APP_URL/api/metrics/twitchtracker/snapshot"
