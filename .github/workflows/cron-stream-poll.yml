name: cron-stream-poll

# Twitch live-state poller. Runs every 5 minutes, hits the snapshot
# endpoint that opens / updates / closes rows in stream_sessions.
#
# GitHub-hosted cron jobs run on a best-effort schedule (delays of
# several minutes are normal at peak hours). Acceptable trade-off here
# since stream-session boundaries don't need second-level precision.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreboys-stream-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/streams/poll
        env:
          # The stream API is hosted by the canonical web application. The
          # legacy metrics origin is intentionally not used here.
          APP_URL: https://thecoreboys.com
          SECRET: ${{ secrets.METRICS_CRON_SECRET }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${SECRET:-}" ]]; then
            echo "METRICS_CRON_SECRET is not configured; refusing an unauthenticated poll." >&2
            exit 1
          fi

          target="${APP_URL%/}/api/streams/poll"
          echo "Polling Twitch live state at ${target}"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 45 \
            -X POST \
            -H "x-cron-secret: $SECRET" \
            -H "accept: application/json" \
            -w "\nHTTP %{http_code}\n" \
            "$target"
