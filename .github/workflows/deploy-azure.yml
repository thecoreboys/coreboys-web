name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: coreboys-prod
  AZURE_CONTAINER_APP: coreboys-web
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  IMAGE_NAME: coreboys-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Node.js for database migrations
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build immutable image in Azure Container Registry
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -Eeuo pipefail
          az acr build \
            --registry "$AZURE_ACR_NAME" \
            --image "$IMAGE_NAME:${GITHUB_SHA}" \
            --image "$IMAGE_NAME:latest" \
            --file Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://thecoreboys.com \
            --build-arg NEXT_PUBLIC_SITE_URL=https://thecoreboys.com \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            .

      - name: Apply additive production database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "DATABASE_URL is required before a production revision can be deployed." >&2
            exit 1
          fi
          node - <<'NODE'
          const raw = process.env.DATABASE_URL;
          let database;
          try {
            database = new URL(raw);
          } catch {
            console.error("DATABASE_URL must be a valid PostgreSQL connection URL.");
            process.exit(1);
          }
          const host = database.hostname.toLowerCase();
          if (["localhost", "127.0.0.1", "::1", "0.0.0.0"].includes(host)) {
            console.error("Production DATABASE_URL cannot point at a loopback host.");
            process.exit(1);
          }
          NODE
          pnpm install --frozen-lockfile
          pnpm db:apply-web-migrations

      - name: Configure production secrets and environment
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          ADMIN_TOTP_ENCRYPTION_KEY: ${{ secrets.ADMIN_TOTP_ENCRYPTION_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FAN_OAUTH_KEY: ${{ secrets.FAN_OAUTH_KEY }}
          FAN_SESSION_SECRET: ${{ secrets.FAN_SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EMAIL_NOTIFICATIONS_ENABLED: ${{ secrets.EMAIL_NOTIFICATIONS_ENABLED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
          RESEND_REPLY_TO_EMAIL: ${{ secrets.RESEND_REPLY_TO_EMAIL }}
          MEDIA_INTELLIGENCE_DATABASE_URL: ${{ secrets.MEDIA_INTELLIGENCE_DATABASE_URL }}
          MEDIA_INTELLIGENCE_PROVIDER: ${{ secrets.MEDIA_INTELLIGENCE_PROVIDER }}
          METRICS_CRON_SECRET: ${{ secrets.METRICS_CRON_SECRET }}
          SOCIAL_SUBSCRIPTION_CRON_SECRET: ${{ secrets.SOCIAL_SUBSCRIPTION_CRON_SECRET }}
          SITE_ACCESS_CODE: ${{ secrets.SITE_ACCESS_CODE }}
          SITE_ACCESS_COOKIE_SECRET: ${{ secrets.SITE_ACCESS_COOKIE_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          SOCIAL_FETCH_API_KEY: ${{ secrets.SOCIAL_FETCH_API_KEY }}
          SOCIAL_NOTIFICATIONS_DELIVERY_ENABLED: ${{ secrets.SOCIAL_NOTIFICATIONS_DELIVERY_ENABLED }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          SPACES_CDN_ENDPOINT: ${{ secrets.SPACES_CDN_ENDPOINT }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_REGION: ${{ secrets.SPACES_REGION }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_EVENTSUB_SECRET: ${{ secrets.TWITCH_EVENTSUB_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          X_API_CREDIT_BALANCE_USD: ${{ secrets.X_API_CREDIT_BALANCE_USD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_MONTHLY_CEILING_USD: ${{ secrets.X_API_MONTHLY_CEILING_USD }}
          X_API_READ_POST_UNIT_USD: ${{ secrets.X_API_READ_POST_UNIT_USD }}
          X_API_READ_USER_UNIT_USD: ${{ secrets.X_API_READ_USER_UNIT_USD }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_COMMUNITIES_JSON: ${{ secrets.X_COMMUNITIES_JSON }}
          X_FEED_REFRESH_MINUTES: ${{ secrets.X_FEED_REFRESH_MINUTES }}
          X_FEED_FULL_ARCHIVE_BACKFILL: ${{ secrets.X_FEED_FULL_ARCHIVE_BACKFILL }}
          X_FEED_FULL_ARCHIVE_MAX_PAGES: ${{ secrets.X_FEED_FULL_ARCHIVE_MAX_PAGES }}
          X_FEED_ALLOW_LOCAL_REFRESH: ${{ secrets.X_FEED_ALLOW_LOCAL_REFRESH }}
          YOUTUBE_WEBHOOK_SECRET: ${{ secrets.YOUTUBE_WEBHOOK_SECRET }}
          YOUTUBE_WEBHOOK_VERIFY_TOKEN: ${{ secrets.YOUTUBE_WEBHOOK_VERIFY_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCOUNT_TOKENS_JSON: ${{ secrets.TIKTOK_ACCOUNT_TOKENS_JSON }}
          TIKTOK_ACCOUNT_HANDLE: ${{ secrets.TIKTOK_ACCOUNT_HANDLE }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          INSTAGRAM_CLIENT_ID: ${{ secrets.INSTAGRAM_CLIENT_ID }}
          INSTAGRAM_CLIENT_SECRET: ${{ secrets.INSTAGRAM_CLIENT_SECRET }}
          INSTAGRAM_ACCOUNT_TOKENS_JSON: ${{ secrets.INSTAGRAM_ACCOUNT_TOKENS_JSON }}
          INSTAGRAM_ACCOUNT_HANDLE: ${{ secrets.INSTAGRAM_ACCOUNT_HANDLE }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_MODE: ${{ vars.INSTAGRAM_API_MODE || 'instagram' }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v26.0' }}
          SOCIAL_NOTIFICATION_MAX_AGE_HOURS: ${{ vars.SOCIAL_NOTIFICATION_MAX_AGE_HOURS || '3' }}
          YOUTUBE_CHANNEL_IDS_JSON: ${{ secrets.YOUTUBE_CHANNEL_IDS_JSON }}
          YOUTUBE_WEBHOOK_CHANNEL_OWNERS_JSON: ${{ secrets.YOUTUBE_WEBHOOK_CHANNEL_OWNERS_JSON }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        run: |
          set -Eeuo pipefail

          declare -a secret_args=()
          declare -a env_args=(
            "NODE_ENV=production"
            "NEXT_PUBLIC_API_URL=https://thecoreboys.com"
            "NEXT_PUBLIC_SITE_URL=https://thecoreboys.com"
            "SOCIAL_WEBHOOK_BASE_URL=https://thecoreboys.com"
            "INSTAGRAM_API_MODE=${INSTAGRAM_API_MODE}"
            "META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION}"
            "SOCIAL_NOTIFICATION_MAX_AGE_HOURS=${SOCIAL_NOTIFICATION_MAX_AGE_HOURS}"
          )

          add_secret() {
            local azure_name="$1"
            local env_name="$2"
            local value="$3"
            if [[ -n "$value" ]]; then
              secret_args+=("${azure_name}=${value}")
              env_args+=("${env_name}=secretref:${azure_name}")
            fi
          }

          add_secret admin-emails ADMIN_EMAILS "$ADMIN_EMAILS"
          add_secret admin-session-secret ADMIN_SESSION_SECRET "$ADMIN_SESSION_SECRET"
          add_secret admin-totp-encryption-key ADMIN_TOTP_ENCRYPTION_KEY "$ADMIN_TOTP_ENCRYPTION_KEY"
          add_secret clerk-secret-key CLERK_SECRET_KEY "$CLERK_SECRET_KEY"
          add_secret database-url DATABASE_URL "$DATABASE_URL"
          add_secret fan-oauth-key FAN_OAUTH_KEY "$FAN_OAUTH_KEY"
          add_secret fan-session-secret FAN_SESSION_SECRET "$FAN_SESSION_SECRET"
          add_secret google-client-id GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          add_secret google-client-secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          add_secret email-notifications-enabled EMAIL_NOTIFICATIONS_ENABLED "$EMAIL_NOTIFICATIONS_ENABLED"
          add_secret resend-api-key RESEND_API_KEY "$RESEND_API_KEY"
          add_secret resend-from-email RESEND_FROM_EMAIL "$RESEND_FROM_EMAIL"
          add_secret resend-from-name RESEND_FROM_NAME "$RESEND_FROM_NAME"
          add_secret resend-reply-to-email RESEND_REPLY_TO_EMAIL "$RESEND_REPLY_TO_EMAIL"
          add_secret media-intelligence-database-url MEDIA_INTELLIGENCE_DATABASE_URL "$MEDIA_INTELLIGENCE_DATABASE_URL"
          add_secret media-intelligence-provider MEDIA_INTELLIGENCE_PROVIDER "$MEDIA_INTELLIGENCE_PROVIDER"
          add_secret metrics-cron-secret METRICS_CRON_SECRET "$METRICS_CRON_SECRET"
          add_secret social-subscription-cron-secret SOCIAL_SUBSCRIPTION_CRON_SECRET "$SOCIAL_SUBSCRIPTION_CRON_SECRET"
          add_secret site-access-code SITE_ACCESS_CODE "$SITE_ACCESS_CODE"
          add_secret site-access-cookie-secret SITE_ACCESS_COOKIE_SECRET "$SITE_ACCESS_COOKIE_SECRET"
          add_secret next-public-clerk-publishable-key NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          add_secret social-fetch-api-key SOCIAL_FETCH_API_KEY "$SOCIAL_FETCH_API_KEY"
          add_secret social-notifications-enabled SOCIAL_NOTIFICATIONS_DELIVERY_ENABLED "$SOCIAL_NOTIFICATIONS_DELIVERY_ENABLED"
          add_secret spaces-bucket SPACES_BUCKET "$SPACES_BUCKET"
          add_secret spaces-cdn-endpoint SPACES_CDN_ENDPOINT "$SPACES_CDN_ENDPOINT"
          add_secret spaces-endpoint SPACES_ENDPOINT "$SPACES_ENDPOINT"
          add_secret spaces-key SPACES_KEY "$SPACES_KEY"
          add_secret spaces-region SPACES_REGION "$SPACES_REGION"
          add_secret spaces-secret SPACES_SECRET "$SPACES_SECRET"
          add_secret twitch-client-id TWITCH_CLIENT_ID "$TWITCH_CLIENT_ID"
          add_secret twitch-client-secret TWITCH_CLIENT_SECRET "$TWITCH_CLIENT_SECRET"
          add_secret twitch-eventsub-secret TWITCH_EVENTSUB_SECRET "$TWITCH_EVENTSUB_SECRET"
          add_secret vapid-private-key VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          add_secret vapid-public-key VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          add_secret vapid-subject VAPID_SUBJECT "$VAPID_SUBJECT"
          add_secret x-api-credit-balance-usd X_API_CREDIT_BALANCE_USD "$X_API_CREDIT_BALANCE_USD"
          add_secret x-api-key X_API_KEY "$X_API_KEY"
          add_secret x-api-monthly-ceiling-usd X_API_MONTHLY_CEILING_USD "$X_API_MONTHLY_CEILING_USD"
          # Paid roster reads are deliberately fail-closed without these two
          # documented unit prices. They must reach the Azure revision, not
          # only GitHub Actions, or the shared X snapshot cannot refresh.
          add_secret x-api-read-post-unit-usd X_API_READ_POST_UNIT_USD "$X_API_READ_POST_UNIT_USD"
          add_secret x-api-read-user-unit-usd X_API_READ_USER_UNIT_USD "$X_API_READ_USER_UNIT_USD"
          add_secret x-api-secret X_API_SECRET "$X_API_SECRET"
          add_secret x-bearer-token X_BEARER_TOKEN "$X_BEARER_TOKEN"
          add_secret x-client-id X_CLIENT_ID "$X_CLIENT_ID"
          add_secret x-client-secret X_CLIENT_SECRET "$X_CLIENT_SECRET"
          add_secret x-communities-json X_COMMUNITIES_JSON "$X_COMMUNITIES_JSON"
          add_secret x-feed-refresh-minutes X_FEED_REFRESH_MINUTES "$X_FEED_REFRESH_MINUTES"
          add_secret x-feed-full-archive-backfill X_FEED_FULL_ARCHIVE_BACKFILL "$X_FEED_FULL_ARCHIVE_BACKFILL"
          add_secret x-feed-full-archive-max-pages X_FEED_FULL_ARCHIVE_MAX_PAGES "$X_FEED_FULL_ARCHIVE_MAX_PAGES"
          add_secret x-feed-allow-local-refresh X_FEED_ALLOW_LOCAL_REFRESH "$X_FEED_ALLOW_LOCAL_REFRESH"
          add_secret youtube-webhook-secret YOUTUBE_WEBHOOK_SECRET "$YOUTUBE_WEBHOOK_SECRET"
          add_secret youtube-webhook-verify-token YOUTUBE_WEBHOOK_VERIFY_TOKEN "$YOUTUBE_WEBHOOK_VERIFY_TOKEN"
          add_secret youtube-api-key YOUTUBE_API_KEY "$YOUTUBE_API_KEY"
          add_secret meta-webhook-verify-token META_WEBHOOK_VERIFY_TOKEN "$META_WEBHOOK_VERIFY_TOKEN"
          add_secret meta-app-secret META_APP_SECRET "$META_APP_SECRET"
          add_secret tiktok-client-key TIKTOK_CLIENT_KEY "$TIKTOK_CLIENT_KEY"
          add_secret tiktok-client-secret TIKTOK_CLIENT_SECRET "$TIKTOK_CLIENT_SECRET"
          add_secret tiktok-account-tokens-json TIKTOK_ACCOUNT_TOKENS_JSON "$TIKTOK_ACCOUNT_TOKENS_JSON"
          add_secret tiktok-account-handle TIKTOK_ACCOUNT_HANDLE "$TIKTOK_ACCOUNT_HANDLE"
          add_secret tiktok-access-token TIKTOK_ACCESS_TOKEN "$TIKTOK_ACCESS_TOKEN"
          add_secret instagram-client-id INSTAGRAM_CLIENT_ID "$INSTAGRAM_CLIENT_ID"
          add_secret instagram-client-secret INSTAGRAM_CLIENT_SECRET "$INSTAGRAM_CLIENT_SECRET"
          add_secret instagram-account-tokens-json INSTAGRAM_ACCOUNT_TOKENS_JSON "$INSTAGRAM_ACCOUNT_TOKENS_JSON"
          add_secret instagram-account-handle INSTAGRAM_ACCOUNT_HANDLE "$INSTAGRAM_ACCOUNT_HANDLE"
          add_secret instagram-token INSTAGRAM_TOKEN "$INSTAGRAM_TOKEN"
          add_secret instagram-user-id INSTAGRAM_USER_ID "$INSTAGRAM_USER_ID"
          add_secret youtube-channel-ids-json YOUTUBE_CHANNEL_IDS_JSON "$YOUTUBE_CHANNEL_IDS_JSON"
          add_secret youtube-webhook-channel-owners-json YOUTUBE_WEBHOOK_CHANNEL_OWNERS_JSON "$YOUTUBE_WEBHOOK_CHANNEL_OWNERS_JSON"
          add_secret facebook-app-id FACEBOOK_APP_ID "$FACEBOOK_APP_ID"
          add_secret facebook-app-secret FACEBOOK_APP_SECRET "$FACEBOOK_APP_SECRET"

          if (( ${#secret_args[@]} > 0 )); then
            az containerapp secret set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP" \
              --secrets "${secret_args[@]}" \
              --output none
          fi

          az containerapp ingress update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --target-port 3000 \
            --transport auto \
            --allow-insecure false \
            --output none

          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --image "$AZURE_ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}" \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 1 \
            --max-replicas 3 \
            --set-env-vars "${env_args[@]}" \
            --output none

      - name: Verify the live Azure revision
        run: |
          set -Eeuo pipefail
          fqdn=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 20 "https://${fqdn}/" >/dev/null; then
              echo "Azure revision is healthy at https://${fqdn}"
              exit 0
            fi
            echo "Waiting for the new revision (${attempt}/30)..."
            sleep 10
          done

          echo "The Azure revision did not become healthy in time." >&2
          exit 1

      - name: Configure reliable social ingestion schedules
        env:
          METRICS_CRON_SECRET: ${{ secrets.METRICS_CRON_SECRET }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${METRICS_CRON_SECRET:-}" ]]; then
            echo "METRICS_CRON_SECRET is required for the Azure social schedules." >&2
            exit 1
          fi

          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.environmentId \
            --output tsv)
          runner='const url=process.env.CORE_CRON_URL;const secret=process.env.CORE_CRON_SECRET;const timeout=Number(process.env.CORE_CRON_TIMEOUT_MS);if(!url||!secret||!Number.isSafeInteger(timeout)||timeout<1000)throw new Error("cron configuration missing");const response=await fetch(url,{method:"POST",headers:{"x-cron-secret":secret,accept:"application/json"},signal:AbortSignal.timeout(timeout)});let body={};try{body=await response.json()}catch{}const status=typeof body?.status==="string"?body.status:undefined;const failureCode=typeof body?.failureCode==="string"?body.failureCode:undefined;console.log(JSON.stringify({httpStatus:response.status,ok:body?.ok??response.ok,status,failureCode}));if(!response.ok)process.exit(1);'
          runner_image='node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32'

          configure_job() {
            local job_name="$1"
            local cron="$2"
            local target_url="$3"
            local request_timeout_ms="$4"
            if az containerapp job show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$job_name" \
              --output none 2>/dev/null; then
              local existing_trigger
              existing_trigger=$(az containerapp job show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$job_name" \
                --query properties.configuration.triggerType \
                --output tsv)
              if [[ "$existing_trigger" != "Schedule" ]]; then
                echo "$job_name exists with trigger type $existing_trigger; refusing an unsafe in-place conversion." >&2
                exit 1
              fi
              az containerapp job secret set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$job_name" \
                --secrets "metrics-cron-secret=$METRICS_CRON_SECRET" \
                --output none
              az containerapp job update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$job_name" \
                --image "$runner_image" \
                --cpu 0.25 \
                --memory 0.5Gi \
                --cron-expression "$cron" \
                --replica-timeout 240 \
                --replica-retry-limit 2 \
                --replica-completion-count 1 \
                --parallelism 1 \
                --command node \
                --args "--input-type=module" "-e" "$runner" \
                --set-env-vars \
                  "CORE_CRON_SECRET=secretref:metrics-cron-secret" \
                  "CORE_CRON_URL=$target_url" \
                  "CORE_CRON_TIMEOUT_MS=$request_timeout_ms" \
                --output none
            else
              az containerapp job create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$job_name" \
                --environment "$environment_id" \
                --trigger-type Schedule \
                --cron-expression "$cron" \
                --replica-timeout 240 \
                --replica-retry-limit 2 \
                --replica-completion-count 1 \
                --parallelism 1 \
                --image "$runner_image" \
                --cpu 0.25 \
                --memory 0.5Gi \
                --command node \
                --args "--input-type=module" "-e" "$runner" \
                --secrets "metrics-cron-secret=$METRICS_CRON_SECRET" \
                --env-vars \
                  "CORE_CRON_SECRET=secretref:metrics-cron-secret" \
                  "CORE_CRON_URL=$target_url" \
                  "CORE_CRON_TIMEOUT_MS=$request_timeout_ms" \
                --output none
            fi

            local actual_trigger actual_cron actual_state
            IFS=$'\t' read -r actual_trigger actual_cron actual_state <<< "$(az containerapp job show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$job_name" \
              --query '{trigger:properties.configuration.triggerType,cron:properties.configuration.scheduleTriggerConfig.cronExpression,state:properties.provisioningState}' \
              --output tsv)"
            if [[ "$actual_trigger" != "Schedule" || "$actual_cron" != "$cron" || "$actual_state" != "Succeeded" ]]; then
              echo "$job_name did not reach the required scheduled configuration." >&2
              exit 1
            fi
          }

          # These offsets avoid the top-of-hour congestion where GitHub says
          # scheduled workflows can be delayed or dropped. Azure jobs are the
          # primary scheduler. GitHub schedules remain a rollout fallback until
          # successful Azure executions are observed, after which they can be
          # changed to manual-only without an ingestion gap.
          configure_job "coreboys-x-feed-cron" "2-59/5 * * * *" "https://thecoreboys.com/api/social/x/refresh" "45000"
          configure_job "coreboys-social-reconcile-cron" "4-59/10 * * * *" "https://thecoreboys.com/api/social/reconcile" "225000"
