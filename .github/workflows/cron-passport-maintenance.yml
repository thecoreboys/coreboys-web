name: cron-passport-maintenance

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Settle Passport escrow and projections
        env:
          APP_URL: ${{ secrets.METRICS_APP_URL }}
          SECRET: ${{ secrets.METRICS_CRON_SECRET }}
        run: |
          set -e
          curl -fsS -X POST \
            -H "x-cron-secret: $SECRET" \
            -w "\nHTTP %{http_code}\n" \
            "$APP_URL/api/passport/maintenance"
