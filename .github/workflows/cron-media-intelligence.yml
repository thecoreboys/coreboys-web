name: cron-media-intelligence

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreboys-media-intelligence
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sync, backfill, clean up, and publish media search
        env:
          APP_URL: https://thecoreboys.com
          SECRET: ${{ secrets.MEDIA_INTELLIGENCE_CRON_SECRET || secrets.METRICS_CRON_SECRET }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${SECRET:-}" ]]; then
            echo "A media-intelligence cron secret is required." >&2
            exit 1
          fi
          target="${APP_URL%/}/api/media-intelligence/catalog-sync"
          echo "Refreshing the searchable media catalog at ${target}"
          failed=0
          for action in cleanup sync archive publish-index; do
            echo "Media stage: $action"
            # Each stage is independently retryable; do not restart an entire
            # archive batch when only publication or cleanup fails.
            if ! curl --fail-with-body --silent --show-error \
              --retry 1 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 180 \
              -X POST \
              -H "content-type: application/json" \
              -H "accept: application/json" \
              -H "x-media-intelligence-secret: $SECRET" \
              --data "{\"action\":\"$action\",\"maxJobs\":20,\"maxArchivePages\":2,\"archivePageSize\":25,\"retentionLimit\":100}" \
              -w "\nHTTP %{http_code}\n" "$target"; then
              failed=1
            fi
          done
          exit "$failed"
