name: cron-media-intelligence

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync, backfill, clean up, and publish media search
        env:
          APP_URL: ${{ secrets.METRICS_APP_URL }}
          SECRET: ${{ secrets.MEDIA_INTELLIGENCE_CRON_SECRET || secrets.METRICS_CRON_SECRET }}
        run: |
          set -e
          curl -fsS -X POST \
            -H "content-type: application/json" \
            -H "x-media-intelligence-secret: $SECRET" \
            --data '{"action":"maintenance","maxJobs":100,"maxArchivePages":8,"archivePageSize":50,"retentionLimit":250}' \
            "$APP_URL/api/media-intelligence/catalog-sync"
